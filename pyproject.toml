[project]
name = "medical-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
# torch is intentionally NOT listed here - the AMD "PyTorch" devcloud container
# already ships a correctly matched torch+ROCm build (2.12.0+rocm7.14.0). Only
# add the pieces on top of what the container provides: peft, trl (not in the
# container by default), and bitsandbytes needs the ROCm-specific pre-release
# wheel, not this plain PyPI entry - see README for the install command.
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "jupyterlab",
    "kaggle>=1.7.4.5",
    "kagglehub>=1.0.2",
    "matplotlib",
    "pandas",
    "peft",
    "pyyaml",
    "seaborn",
    "tensorboard",
    "transformers",
    "trl",
]

[tool.uv]
package = false
