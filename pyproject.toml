[project]
name = "medical-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "jupyterlab",
    "kaggle>=1.7.4.5",
    "kagglehub>=1.0.2",
    "matplotlib",
    "pandas",
    "peft",
    "pyyaml",
    "seaborn",
    "tensorboard",
    "torch==2.10.0",
    "transformers",
    "trl",
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }

[tool.uv]
package = false
